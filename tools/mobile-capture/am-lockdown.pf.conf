# Block inbound ADB (5555) and mitmproxy (8080) on every non-loopback
# interface. Loopback is untouched, so `adb -s 127.0.0.1:5555` and the
# device's 10.0.2.2 -> host-loopback proxy hop both keep working.
#
# Load (does not survive reboot):
#   sudo pfctl -a com.apple/am-lockdown -f tools/mobile-capture/am-lockdown.pf.conf
#   sudo pfctl -E
# Unload:
#   sudo pfctl -a com.apple/am-lockdown -F rules
block drop in quick on ! lo0 proto tcp from any to any port 5555
block drop in quick on ! lo0 proto tcp from any to any port 8080
